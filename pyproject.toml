[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "water-business-manager"
version = "1.0.0"
description = "Complete Bottled Water Stock, Billing, Credit, Refill and Revenue Management System"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Water Business Solutions", email = "info@purelifewater.lk" }
]
dependencies = [
    "PySide6>=6.6.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "openpyxl>=3.1.2",
    "argon2-cffi>=23.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pyinstaller>=6.3.0",
]

[project.scripts]
water-manager = "main:main"
